
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Catalog</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>

<main>
  <h1 th:text="${title}">Book Catalog</h1>
  <p>Spring MVC Laboratory Work 5</p>

  <!-- Сообщение после добавления книги -->
  <p th:if="${message}" th:text="${message}"></p>

  <h2>Search by Author</h2>

  <form th:action="@{/books}" method="get">
    <input type="text"
           name="author"
           placeholder="Enter author name"
           th:value="${author}">

    <button type="submit">Search</button>
    <a th:href="@{/books}">Show All</a>
  </form>

  <h2>Available Books</h2>

  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Author</th>
      <th>Year</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="book : ${books}">
      <td th:text="${book.id}">1</td>
      <td th:text="${book.title}">Effective Java</td>
      <td th:text="${book.author}">Joshua Bloch</td>
      <td th:text="${book.year}">2018</td>
    </tr>

    <tr th:if="${#lists.isEmpty(books)}">
      <td colspan="4">No books found</td>
    </tr>
    </tbody>
  </table>

  <h2>Add New Book</h2>

  <form th:action="@{/books}" method="post">
    <input type="text"
           name="title"
           placeholder="Book title"
           required>

    <input type="text"
           name="author"
           placeholder="Author"
           required>

    <input type="number"
           name="year"
           placeholder="Year"
           required>

    <button type="submit">Add Book</button>
  </form>

</main>

</body>
</html>
